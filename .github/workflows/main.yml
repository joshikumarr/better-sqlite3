name: Build Prebuilds

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new release'
        type: boolean
        default: true

env:
  # Node.js versions (Node 22 = v127)
  NODE_BUILD_CMD: npx --no-install prebuild -r node -t 20.0.0 -t 22.0.0 --include-regex 'better_sqlite3.node$' --tag v12.4.4
  # Electron versions (Electron 39 = v140)
  ELECTRON_BUILD_CMD: npx --no-install prebuild -r electron -t 39.0.0 --include-regex 'better_sqlite3.node$' --tag v12.4.4

jobs:
  # Create release if manually triggered
  create-release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: ${{ steps.get_version.outputs.tag_name }}
          body: |
            better-sqlite3 prebuilds with Conveyor headerpad flags for macOS code signing.

            Includes prebuilds for:
            - Node.js 20, 22
            - Electron 39

            Platforms:
            - macOS arm64 (Apple Silicon)
            - macOS x64 (Intel)
            - Windows x64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS Apple Silicon (arm64)
  prebuild-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: brew install python-setuptools
      - run: npm install --ignore-scripts
      - name: Build Node.js prebuilds
        run: ${{ env.NODE_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}
      - name: Build Electron prebuilds
        run: ${{ env.ELECTRON_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}

  # macOS Intel (x64)
  prebuild-macos-x64:
    name: macOS x64
    runs-on: macos-13
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: brew install python-setuptools
      - run: npm install --ignore-scripts
      - name: Build Node.js prebuilds
        run: ${{ env.NODE_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}
      - name: Build Electron prebuilds
        run: ${{ env.ELECTRON_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}

  # Windows x64
  prebuild-windows:
    name: Windows x64
    runs-on: windows-2022
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip.exe install setuptools
      - run: npm install --ignore-scripts
      - name: Build Node.js prebuilds
        run: ${{ env.NODE_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}
      - name: Build Electron prebuilds
        run: ${{ env.ELECTRON_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}

