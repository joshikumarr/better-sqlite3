name: build

on:
  release:
    types:
      - released
  workflow_dispatch: {}

env:
  NODE_BUILD_CMD: npx --no-install prebuild -r node -t 20.0.0 -t 22.0.0 --include-regex 'better_sqlite3.node$'
  ELECTRON_BUILD_CMD: npx --no-install prebuild -r electron -t 39.0.0 --include-regex 'better_sqlite3.node$'

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # mac.aarch64
          - macos-15-intel # mac.amd64
          - windows-2022  # windows.amd64
    name: Prebuild on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - if: ${{ startsWith(matrix.os, 'windows') }}
        run: pip.exe install setuptools
      
      - if: ${{ startsWith(matrix.os, 'macos') }}
        run: brew install python-setuptools
      
      - run: npm install --ignore-scripts
      
      - run: ${{ env.NODE_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}
      
      - run: ${{ env.ELECTRON_BUILD_CMD }} -u ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload prebuilds as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/
          
  upload-release-assets:
    if: github.event_name == 'workflow_dispatch'
    name: Upload Build Assets to Release
    runs-on: ubuntu-latest
    needs: prebuild
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: List downloaded files
        run: ls -R ./release-artifacts

      - name: Upload release artifacts to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v12.4.4
          files: ./release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
